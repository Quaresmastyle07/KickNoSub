plugins { id 'com.android.application' }

android {
    namespace 'de.fm.taktikboard'
    compileSdk 35

    defaultConfig {
        applicationId 'de.fm.taktikboard.offline'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.7.0'
    }

    signingConfigs {
        release {
            storeFile file('fm-taktikboard-release.jks')
            storePassword 'FMTaktikboard2026!'
            keyAlias 'fm-taktikboard'
            keyPassword 'FMTaktikboard2026!'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
}
